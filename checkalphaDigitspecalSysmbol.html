<!DOCTYPE html>
<html>
<head>
    <title>Character Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin-top: 80px;
        }

        .box {
            width: 380px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 200px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 8px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: lightblue;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Character Checker</h2>

        <p>Enter any one character:</p>

        <input type="text" id="character"
               placeholder="Enter character"
               maxlength="1">

        <br>

        <button type="button" onclick="checkCharacter()">
            Check Character
        </button>

        <button type="button" onclick="clearResult()">
            Clear
        </button>

        <div id="result"></div>

    </div>


    <script>

        function checkCharacter() {

            let num = document.getElementById("character").value;
            let result = document.getElementById("result");

            if (num.length == 0) {

                result.innerHTML =
                    "Please enter a character.";

            }

            else if (num >= "0" && num <= "9") {

                result.innerHTML =
                    "It is a Digit.";

            }

            else if ((num >= "A" && num <= "Z") ||
                     (num >= "a" && num <= "z")) {

                result.innerHTML =
                    "It is an Alphabet.";

            }

            else {

                result.innerHTML =
                    "It is a Special Character.";
            }
        }


        function clearResult() {

            document.getElementById("character").value = "";

            document.getElementById("result").innerHTML = "";
        }

    </script>

</body>
</html>
