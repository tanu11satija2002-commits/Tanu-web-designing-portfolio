<html> 
	<head>
		<script type="text/javascript">
		num=parseInt(prompt("Enter Number"))
		a=1
		for(x=num;x>0;x--)
		{
		for(y=1;y<=x;y++)
		{
		document.write(a)
		a++
		}
		document.write("<br>")
		}

		</script>
	</head>
<body>
<h1>Pattern by giving number is:</h1>
</body>
</html>
