<html>
    <head>
        <script type ="text/javascript">
            function totalCost()
            { 
                sum=0
                document.getElementById("txta").value=""
            for(i=0;i<document.forms[0].menu1.options.length;i++)
            {
                
                if(document.forms[0].menu1.options[i].selected==true)
                {
                document.getElementById("txta").value+=document.forms[0].menu1.options[i].text
                document.getElementById("txta").value+="---"+document.forms[0].menu1.options[i].value+"\n"
                sum=sum+parseInt(document.forms[0].menu1.options[i].value)
                 }
             }

             for(i=0;i<document.forms[0].menu2.options.length;i++)
            {
                if(document.forms[0].menu2.options[i].selected==true)
                {
                document.getElementById("txta").value+=document.forms[0].menu2.options[i].text
                document.getElementById("txta").value+="---"+document.forms[0].menu2.options[i].value+"\n"
                sum=sum+parseInt(document.forms[0].menu2.options[i].value)
                }
             }
            for(i=0;i<document.forms[0].menu3.options.length;i++)
            {
                if(document.forms[0].menu3.options[i].selected==true)
                {
                document.getElementById("txta").value+=document.forms[0].menu3.options[i].text
                document.getElementById("txta").value+="---"+document.forms[0].menu3.options[i].value+"\n"
                sum=sum+parseInt(document.forms[0].menu3.options[i].value)
                 }
            }
            
       

            document.getElementById("txta").value+="totalamount is"+sum
        }
        
        </script>
