<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chessboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f2f2f2;font-family:Arial,sans-serif}
.container{text-align:center}
h1{color:#333;margin-bottom:20px}
.chessboard{width:480px;height:480px;display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #333;margin:auto}
.square{display:flex;justify-content:center;align-items:center;font-size:42px}
.light{background:#f0d9b5}.dark{background:#b58863}
.pieces{user-select:none}
@media(max-width:520px){.chessboard{width:90vw;height:90vw}.square{font-size:8vw}}
</style>
</head>
<body>
<div class="container">
<h1>♟ Chessboard</h1>
<div class="chessboard">
<div class="square light">♜</div><div class="square dark">♞</div><div class="square light">♝</div><div class="square dark">♛</div><div class="square light">♚</div><div class="square dark">♝</div><div class="square light">♞</div><div class="square dark">♜</div>
<div class="square dark">♟</div><div class="square light">♟</div><div class="square dark">♟</div><div class="square light">♟</div><div class="square dark">♟</div><div class="square light">♟</div><div class="square dark">♟</div><div class="square light">♟</div>
<div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
<div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
<div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
<div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
<div class="square light">♙</div><div class="square dark">♙</div><div class="square light">♙</div><div class="square dark">♙</div><div class="square light">♙</div><div class="square dark">♙</div><div class="square light">♙</div><div class="square dark">♙</div>
<div class="square dark">♖</div><div class="square light">♘</div><div class="square dark">♗</div><div class="square light">♕</div><div class="square dark">♔</div><div class="square light">♗</div><div class="square dark">♘</div><div class="square light">♖</div>
</div>
</div>
</body>
</html>
